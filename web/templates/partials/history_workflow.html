{% set backfill_view = backfill_view|default(false) %}
<section id="history-workflow" class="hw-section" data-capital="{{ paper_initial_capital }}" data-backfill="{{ 'true' if backfill_view else 'false' }}">
  <div class="hw-toolbar">
    <h2>{{ '行情补数任务' if backfill_view else '冻结回测任务' }}</h2>
    <select id="hw-jobs" aria-label="历史数据任务"><option value="">选择任务</option></select>
    <button id="hw-create" class="pf-button" type="button">创建任务</button>
    <button id="hw-refresh" class="pf-button" type="button">刷新</button>
    <button id="hw-cancel" class="pf-button" type="button" disabled>取消阶段</button>
    {% if not backfill_view %}<a id="hw-backfill-link" href="/market-backfill" class="hw-nav">独立行情补数</a>{% endif %}
  </div>
  <div id="hw-status" role="status" aria-live="polite">未选择任务</div>
  <div id="hw-version" class="hw-meta"></div>
  <div class="hw-actions">
    <button class="pf-button" type="button" data-hw-phase="prepare" disabled>1 读取历史池名单</button>
    <button class="pf-button" type="button" data-hw-phase="prefetch" disabled>2 独立补数</button>
    <button class="pf-button" type="button" data-hw-phase="freeze" disabled>3 校验并冻结</button>
    {% if not backfill_view %}
      <button class="pf-button" type="button" data-hw-phase="run" disabled>4 只读回测</button>
      <button class="pf-button" type="button" data-hw-phase="reconcile" disabled>5 归档对账</button>
    {% endif %}
  </div>
  <progress id="hw-progress" max="100" value="0" aria-label="当前阶段进度"></progress>
  <div id="hw-error" role="alert"></div>
  <div id="hw-summary" class="hw-summary"></div>
  <div id="hw-data-summary" class="hw-summary"></div>
  <div class="hw-downloads">
    <a id="hw-validation-link" hidden target="_blank" rel="noopener">校验报告 JSON</a>
    <a id="hw-result-link" hidden target="_blank" rel="noopener">回测报告 JSON</a>
    <a id="hw-reconciliation-link" hidden target="_blank" rel="noopener">对账报告 JSON</a>
    {% if backfill_view %}<a id="hw-use-backtest" hidden>使用此版本回测</a>{% endif %}
  </div>
  <div class="hw-table" id="hw-detail"></div>
  <details id="hw-trades" hidden><summary>冻结回测成交</summary><div id="hw-trades-detail" class="hw-table"></div></details>
  <details><summary>任务日志</summary><pre id="hw-log" style="max-height:240px;overflow:auto;white-space:pre-wrap;font-size:12px"></pre></details>
</section>
<style>
  .hw-section{padding:18px 0;border-bottom:1px solid #334155;margin-bottom:16px;min-width:0}
  .hw-toolbar,.hw-actions,.hw-downloads{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hw-toolbar h2{font-size:15px;margin:0;font-weight:600}.hw-toolbar select{max-width:100%;min-width:180px;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:4px;padding:6px}
  .hw-meta,#hw-status{margin-top:9px;overflow-wrap:anywhere;font-size:12px;color:#94a3b8}.hw-actions{margin:14px 0}
  .hw-actions button{min-height:36px}.hw-actions button:disabled{opacity:.45;cursor:not-allowed}.hw-actions button[data-state=complete]{border-color:#059669;color:#6ee7b7}
  #hw-progress{width:100%;height:8px;accent-color:#10b981}#hw-error{color:#fda4af;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
  .hw-summary{display:flex;flex-wrap:wrap;gap:20px;margin:12px 0;font-size:13px}.hw-downloads a,.hw-nav{font-size:12px;color:#6ee7b7}.hw-downloads a[hidden]{display:none}
  .hw-table{overflow:auto;max-height:400px;margin-top:12px;min-width:0;width:100%}#history-workflow .hw-table table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px;table-layout:auto}#history-workflow .hw-table th,#history-workflow .hw-table td{text-align:left;padding:8px;border-bottom:1px solid #334155;white-space:nowrap;word-break:normal;overflow-wrap:normal}#history-workflow .hw-table td:last-child{white-space:normal;min-width:240px}
  @media(max-width:640px){.hw-toolbar select{width:100%}.hw-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.hw-actions button{font-size:12px;padding:6px 4px}}
</style>
<script src="/static/history-workflow.js?v=20261025-5"></script>
