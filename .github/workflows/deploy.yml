name: Deploy to Aliyun

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ALIYUN_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.ALIYUN_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh ${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }} << 'EOF'
            set -e
            cd "${{ secrets.ALIYUN_APP_DIR }}"
            git config --global --add safe.directory "$PWD"
            git fetch origin main
            git reset --hard origin/main
            if [ ! -d ".venv" ]; then python3 -m venv .venv; fi
            . .venv/bin/activate
            pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
            python -X utf8 scripts/check_eltdx_runtime.py
            python -X utf8 scripts/replay_board_shadow.py --fixture tests/fixtures/board_shadow_replay.json

            sudo -n /usr/bin/systemctl restart a-stock
            /usr/bin/systemctl status a-stock --no-pager
            if systemctl is-enabled --quiet a-stock-market.target; then
              if ! sudo -n /usr/bin/systemctl restart a-stock-market.target; then
                echo "Deploy user needs NOPASSWD for /usr/bin/systemctl restart a-stock-market.target"
                exit 1
              fi
              /usr/bin/systemctl status a-stock-collector a-stock-archiver a-stock-strategy --no-pager
            else
              echo "Market workers are not installed/enabled; Web restart does not start them."
            fi
          EOF
